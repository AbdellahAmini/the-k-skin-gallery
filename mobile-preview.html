<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile QA — 390 × 844</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e9e4df;
      color: #282526;
      font: 12px Arial, sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 0;
      background: #f7f6f3;
      box-shadow: 0 10px 30px #28252626;
    }
  </style>
</head>

<body>
  <main><strong>Mobile layout · 390 × 844 CSS px</strong><iframe src="/" title="K-Skin Gallery mobile layout"></iframe>
  </main>
